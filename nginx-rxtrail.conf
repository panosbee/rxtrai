# RxTrail CRM — Nginx server block for rxtrail.top
# Place at: /etc/nginx/sites-available/rxtrail
# Enable: ln -s /etc/nginx/sites-available/rxtrail /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name rxtrail.top www.rxtrail.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name rxtrail.top www.rxtrail.top;

    ssl_certificate /etc/letsencrypt/live/rxtrail.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rxtrail.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Upload size limit (Excel imports)
    client_max_body_size 20M;

    # ── Landing page & static files ────────────────────────────────────
    location / {
        root /var/www/rxtrail/frontend;
        index landing.html;
        try_files $uri $uri/ /landing.html;
    }

    # App SPA at /app
    location /app {
        alias /var/www/rxtrail/frontend;
        index index.html;
        try_files $uri /index.html;
    }

    # Static assets — SHORT cache because the app updates frequently
    # JS/CSS/HTML: 5 min cache with must-revalidate (always check server)
    location ~* \.(css|js|html)$ {
        root /var/www/rxtrail/frontend;
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        try_files $uri =404;
    }

    # Icons/fonts: longer cache (they rarely change)
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2?|ttf)$ {
        root /var/www/rxtrail/frontend;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # manifest.json: no cache
    location = /manifest.json {
        root /var/www/rxtrail/frontend;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # sw.js: no cache (critical for updates)
    location = /sw.js {
        root /var/www/rxtrail/frontend;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Uploaded files
    location /uploads/ {
        alias /var/www/rxtrail/uploads/;
    }

    # ── API proxy ──────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8002/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts — generous for AI calls and imports
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;

        # WebSocket support (for future real-time features)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── Security blocks ────────────────────────────────────────────────
    location ~ /\.env {
        return 444;
    }
    location ~ /\.git {
        return 444;
    }
    location ~ /backend/ {
        return 444;
    }
    location ~ /__pycache__/ {
        return 444;
    }
}
